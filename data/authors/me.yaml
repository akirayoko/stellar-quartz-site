bio: |
  Akira Yoko is an associate professor at Tohoku University. 
  His research focuses on exploring the science of ultrasmall metal oxide nanoparticles. 
  He utilizes a chemical engineering approach to pioneer new material science and physical chemistry of nanomaterials, particularly through supercritical hydrothermal synthesis.
