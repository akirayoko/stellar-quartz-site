# SITE BRANDING
branding:
  name: Akira Yoko
  full_name: Akira Yoko
  # ロゴ画像がある場合は static/media/logo.png に配置して以下を有効にできます
  # logo:
  #   src: logo.png
  #   alt: Logo

# CONTACT DETAILS
# フォームの送信先や住所を設定します
contact_links:
  - icon: at-symbol
    url: mailto:akira.yoko.c7@tohoku.ac.jp
    label: Email

# SITE FEATURES
features:
  # 検索機能を有効にするか
  search:
    provider: 'algolia' # または 'fuzzy'
  # ダークモードの切り替えを許可するか
  appearance:
    theme: 'minimal' # 'minimal', 'ocean', 'forest' などから選択可能
    allow_toggle: true

# FOOTER
footer:
  copyright:
    notice: '© {year} Akira Yoko'
