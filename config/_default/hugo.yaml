# Configuration of Hugo
# Guide: https://docs.hugoblox.com/tutorial/
# Hugo Documentation: https://gohugo.io/getting-started/configuration/#all-configuration-settings

# Website name (set in params.yaml under hugoblox.branding.name)
title: 'Akira Yoko'

# Website URL
# 自分のGitHub PagesのURL（例: https://akirayoko.github.io/stellar-quartz-site/）に変更してください
baseURL: 'https://akirayoko.github.io/stellar-quartz-site/'

############################
## LANGUAGE
############################

defaultContentLanguage: en
# 日本語などの検索や文字カウントを正しく行うために true に設定
hasCJKLanguage: true
defaultContentLanguageInSubdir: false
removePathAccents: true

############################
## PAGE OPTIONS
############################

cascade:
  - _target:
      path: /slides/**
    kind: page
    outputs: [HTML, present]

############################
## ADVANCED
############################

build:
  writeStats: true
  enableGitInfo: false
  summaryLength: 30

pagination:
  pagerSize: 10

enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles: [".ipynb_checkpoints$", "\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
disableAliases: true

outputs:
  home: [HTML, RSS, headers, redirects, backlinks]
  section: [HTML, RSS]

imaging:
  resampleFilter: lanczos
  quality: 90
  anchor: smart
  hint: picture
  timeout: 600000

taxonomies:
  author: authors
  tag: tags
  publication_type: publication_types

markup:
  _merge: deep
  highlight:
    lineNos: false

security:
  _merge: deep

sitemap:
  _merge: deep
