# config/_default/hugo.yaml

# サイトの基本設定
title: Akira Yoko, Ph.D. | Tohoku University
baseURL: "https://akirayoko.jp/"
languageCode: "ja-jp"
hasChildrenSpacing: true

# 多言語設定：国際的なプレゼンス（ISHA等）と国内（東大物性研/NIMS）の両立
languages:
  en:
    languageCode: "en-us"
    contentDir: "content/en"
    title: "Akira Yoko, Ph.D."
    params:
      description: "Associate Professor at Tohoku University. Expert in Supercritical Hydrothermal Synthesis and Nanomaterials Science."
  ja:
    languageCode: "ja-jp"
    contentDir: "content/ja"
    title: "横 亮 (Akira Yoko) - 東北大学 准教授"
    params:
      description: "東北大学多元物質科学研究所 准教授。超臨界水熱合成を用いたナノ材料創製とそのプロセス開発に従事。"

# メニュー構成：実績（h-index 18 / 論文57本）と直近の重要プロジェクトを強調
menu:
  main:
    - name: About
      url: "#about"
      weight: 10
    - name: Research
      url: "#projects" # ナノ材料合成や超臨界プロセスの研究
      weight: 20
    - name: Publications
      url: "#publications" # Researchmap/ORCIDと連動した最新リスト
      weight: 30
    - name: ISHA 2027
      url: "/isha-seminar" # 2027年3月のセミナー開催に向けて独立
      weight: 40
    - name: Contact
      url: "#contact"
      weight: 50

params:
  # ブランディング：学術的信頼感の高いデザイン
  appearance:
    theme: "minimal"
    font: "playfair" # 落ち着いたセリフ体を選択
    font_size: "L"

  # 連絡先・所属情報（Researchmap準拠）
  contact_links:
    - icon: twitter
      icon_pack: fab
      link: "https://twitter.com/yoko_akira" # アカウントがある場合
    - icon: google-scholar
      icon_pack: ai
      link: "https://scholar.google.com/citations?user=YOUR_ID"
    - icon: researchgate
      icon_pack: ai
      link: "https://www.researchgate.net/profile/Akira-Yoko"
    - icon: orcid
      icon_pack: ai
      link: "https://orcid.org/0000-0002-1278-272X"
    - icon: cv
      icon_pack: ai
      link: "https://researchmap.jp/7000020994"

  # SEO・SNS共有設定
  marketing:
    google_analytics: "G-XXXXXXXXXX" # 必要に応じて設定

  # 論文引用数などの自動バッジを表示する場合
  features:
    citation_badges: true
